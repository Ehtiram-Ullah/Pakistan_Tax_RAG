[project]
name = "taxlens-api"
version = "2.0.0"
description = "Evidence-grounded Pakistan tax research API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "python-dotenv==1.2.4",
    "qdrant-client==1.19.1",
    "sentence-transformers==6.1.0",
    "google-genai==2.28.0",
    "uvicorn[standard]==0.54.0",
    "huggingface-hub==1.33.0",
    "torch==2.14.1",
]

[tool.uv]
package = false

# Keep Linux deployment on CPU-only PyTorch when Vercel resolves with uv.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.vercel]
entrypoint = "api.main:app"

[tool.vercel.scripts]
build = "python -m scripts.prepare_model"
